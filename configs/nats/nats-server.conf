# ==============================================================================
# NATS Server 配置 — OPIC 事件总线（O-SYS）的第 3 层传输实现
# ==============================================================================
# 定位：只承担**传输与短期缓冲**，不是平台状态存储。
#       O-SYS 的 EventType / EventSubscription / INV-20·22·23·24 / PROC-05
#       是语义权威；本文件只决定「怎么送」。
#
# 鉴权：由 docker compose 的 --user / --pass 注入（口令只存 .env，不入版本库）。
# JetStream 限额：写在本文件（NATS 配置不支持环境变量插值，写成 env 会变悬空开关）。
# ==============================================================================

server_name: opic-nats

# 客户端监听。容器内固定 4222，宿主映射见 .env 的 NATS_CLIENT_PORT
listen: 0.0.0.0:4222

# 监控端点：/healthz（健康） · /varz（运行指标） · /jsz（JetStream 指标）
# 供 OPIC 可观测域（O-MON）采集；不要暴露到公网。
http: 0.0.0.0:8222

# ── JetStream：事件持久化与重放 ────────────────────────────────────────────────
# 对应 O-SYS「事件订阅」的 at-least-once 投递与「订阅暂停期间不投递但保留关系」。
jetstream {
  store_dir: "/data/jetstream"
  # 内存型流的字节上限（JetStream 的 memory storage）
  max_memory_store: 1G
  # 文件型流的字节上限（持久化事件的主要占用）
  max_file_store: 20G
  # 单账号 stream 数上限属账号级限额（max_streams 不接受服务器级配置，
  # NATS 2.14 会报 unknown field；在账户 jetstream 限额中设置）
}

# ── 日志 ─────────────────────────────────────────────────────────────────────
debug: false
trace: false
logtime: true
