# ==============================================================================
# Casdoor 应用配置（非敏感项）
# ==============================================================================
# 口令纪律: 数据库口令经 compose 环境变量注入（driverName/dataSourceName），
# 本文件**不含任何口令**。全部可调项见 casdoor 官方 conf/app.conf。
# ==============================================================================

appname = casdoor
httpport = 8000
runmode = prod

# 库名（casdoor 从文件配置读 dbName 构造表名；env 的 dataSourceName 只用于连接）
dbName = casdoor

# 请求体拷贝（表单/JSON API 需要）
copyrequestbody = true

# 会话: 文件存储（容器内临时目录；多实例部署时改 Redis 并指向 opic-redis）
SessionProvider = file
sessiondir = /tmp/casdoor-sessions

# 成功/删除页关闭（内网集成场景减少跳转噪音）
showSuccessPage = false
showDeletePage = false

# 语言默认项（zh/en 完整；100 语种 LOCALES 由前端 i18n 纪律承接）
language = zh
