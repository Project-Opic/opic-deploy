# ==============================================================================
# Temporal 动态配置（development-sql.yaml）
# ==============================================================================
# 挂载到容器内 /etc/temporal/config/dynamicconfig/，由环境变量
# DYNAMIC_CONFIG_FILE_PATH 指向本文件。修改后需重启 temporal 服务生效。
#
# 键格式：<key>: [ { value: <v> } ]
# 完整键清单见 Temporal 仓库 dynamicconfig/ 目录。
#
# 设计取舍：本文件只保留**确有需要且低风险**的键。
#           默认值已可满足 OPIC 的流程引擎与编排运行时场景，不做无谓调参。
# ==============================================================================

# namespace 的 retention 下限（天）。默认值为 1，显式写出便于交付现场按需上调；
# 与 .env 的 TEMPORAL_RETENTION_DAYS 配合使用。
system.minRetentionDays:
  - value: 1
