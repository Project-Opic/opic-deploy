# OPIC HA — 阿里云 lab（nebula 覆盖网）YAML inventory
# 目标机：10.26.8.157/158/159（Alibaba Cloud Linux 3, 4C/15G, 3×500G 空数据盘）
# 用法：ansible-playbook -i inventories/aliyun/hosts.yml playbooks/00.pre-check.yml
all:
  children:
    harbor:
      hosts:
        ali157: { ansible_host: 10.26.8.157 }
        ali158: { ansible_host: 10.26.8.158 }
        ali159: { ansible_host: 10.26.8.159 }
    nfs_vip:
      hosts:
        ali157:
          drbd_seq: 1
          drbd_device_minor: 0
          drbd_disk: /dev/nvme2n1
          peer_hostname: ali158
          peer_address: 10.0.0.58     # VPC 内网（0.16ms，DRBD 数据链路）
          peer_disk: /dev/nvme2n1
          keepalived_priority: 150
          keepalived_unicast_src_ip: 10.26.8.157
          keepalived_unicast_peer: ["10.26.8.158"]
        ali158:
          drbd_seq: 2
          drbd_device_minor: 0
          drbd_disk: /dev/nvme2n1
          peer_hostname: ali157
          peer_address: 10.0.0.57     # VPC 内网
          peer_disk: /dev/nvme2n1
          keepalived_priority: 100
          keepalived_unicast_src_ip: 10.26.8.158
          keepalived_unicast_peer: ["10.26.8.157"]
    pg_cluster:
      hosts:
        ali157: { pg_seq: 1, pg_role: primary }
        ali158: { pg_seq: 2, pg_role: replica }
        ali159: { pg_seq: 3, pg_role: replica }
    apps:
      hosts:
        ali157: { app_seq: 1 }
        ali158: { app_seq: 2 }
    vibe:
      hosts:
        ali157: {}
    infra:
      hosts:
        ali159: {}
    # 派生组
    drbd:
      children: { nfs_vip: {} }
    ganesha:
      children: { nfs_vip: {} }
    keepalived_nfs:
      children: { nfs_vip: {} }
    etcd_cluster:
      children: { pg_cluster: {} }
    redis_cluster:
      children: { pg_cluster: {} }
    kafka_cluster:
      children: { pg_cluster: {} }
    minio_cluster:
      children: { pg_cluster: {} }
    traefik:
      children: { harbor: {} }
  vars:
    ansible_user: root
    # 目标机默认 python3 → /opt/aiext/bin/python3.12（已补 requests）
    ansible_python_interpreter: /opt/aiext/bin/python3.12
