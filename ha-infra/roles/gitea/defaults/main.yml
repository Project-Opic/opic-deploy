---
gitea_image: "gitea/gitea:1.22"
gitea_http_port: "{{ port_map.gitea_http }}"
gitea_ssh_port: "{{ port_map.gitea_ssh }}"
gitea_dir: "{{ opic_ha_stack }}/gitea"
gitea_data: "{{ opic_harbor_data }}/gitea"     # NFS 共享（各 apps 节点已挂 /opt/opic/harbor/data）
