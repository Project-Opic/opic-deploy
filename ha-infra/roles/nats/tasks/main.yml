---
# NATS ×3 JetStream cluster（pg_cluster 全部三台）
- name: create nats dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ nats_dir }}"
    - "{{ nats_data }}"

- name: render nats-server.conf (JetStream cluster)
  ansible.builtin.template:
    src: nats-server.conf.j2
    dest: "{{ nats_dir }}/nats-server.conf"
    mode: '0640'

- name: chown nats data dir for container uid
  ansible.builtin.file:
    path: "{{ nats_data }}"
    owner: "1000"
    group: "1000"
    mode: '0750'

- name: render nats docker-compose.yml
  ansible.builtin.template:
    src: docker-compose-nats.yml.j2
    dest: "{{ nats_dir }}/docker-compose.yml"
    mode: '0644'

- name: docker compose up nats
  ansible.builtin.command: docker compose -f {{ nats_dir }}/docker-compose.yml up -d
  changed_when: true

- name: wait nats monitor port
  ansible.builtin.wait_for:
    port: "{{ nats_monitor_port }}"
    timeout: 60

- name: nats cluster healthz
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ nats_monitor_port }}/healthz"
    status_code: [200]
  register: nats_health
  retries: 10
  delay: 3
  until: nats_health.status == 200
