---
- name: daemon reload
  ansible.builtin.systemd:
    daemon_reload: true

- name: dbus restart
  ansible.builtin.systemd:
    name: dbus
    state: reloaded
  # SIGHUP 热加载 /etc/dbus-1/system.d 策略，避免重启 dbus 牵连其他服务

- name: restart ganesha
  ansible.builtin.systemd:
    name: nfs-ganesha
    state: restarted
  # 设计口径：ganesha 由 keepalived notify 拉起；此处仅配置变更时重启
  # （若当前未运行则忽略失败）
  register: _grestart
  failed_when: false
