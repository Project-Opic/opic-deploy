---
# Ganesha 角色任务（对应 runbook P1 + P2a + §二-15/16）
- name: install nfsd kernel module auto-load
  ansible.builtin.copy:
    content: "nfsd\n"
    dest: /etc/modules-load.d/nfs-ganesha.conf
    mode: '0644'
  register: modload

- name: load nfsd module now
  community.general.modprobe:
    name: nfsd
    state: present

- name: install Ganesha build dependencies (al8/Anolis)
  ansible.builtin.package:
    name:
      - gcc
      - gcc-c++
      - make
      - cmake
      - bison
      - flex
      - libcap-devel
      - libblkid-devel
      - libuuid-devel
      - libtirpc-devel
      - nfs-utils
      - dbus-devel
      - krb5-devel
      - openssl-devel
      - libnfsidmap-devel
      - dbus-glib-devel
    state: present

- name: create Ganesha source/build directory
  ansible.builtin.file:
    path: "{{ ganesha_source_dir }}"
    state: directory
    mode: '0755'

- name: ensure offline dir on target
  ansible.builtin.file:
    path: "{{ ganesha_offline_dir }}"
    state: directory
    mode: '0755'

- name: push offline media to target
  ansible.builtin.copy:
    src: "{{ offline_dir }}/nfs-ganesha-{{ ganesha_version }}.tar.gz"
    dest: "{{ ganesha_offline_dir }}/"
    mode: '0644'

- name: extract Ganesha source (offline media; src/libntirpc bundled in repacked tarball)
  ansible.builtin.unarchive:
    src: "{{ ganesha_offline_dir }}/nfs-ganesha-{{ ganesha_version }}.tar.gz"
    dest: "{{ ganesha_source_dir }}"
    remote_src: true

# 修复后的离线包已把 libntirpc submodule 捆绑进 src/libntirpc；
# 仅当包内缺失时才解独立 ntirpc 包。
- name: check bundled libntirpc
  ansible.builtin.stat:
    path: "{{ ganesha_source_dir }}/nfs-ganesha-{{ ganesha_version }}/src/libntirpc/CMakeLists.txt"
  register: bundled_ntirpc

- name: extract ntirpc (fallback when not bundled)
  ansible.builtin.unarchive:
    src: "{{ offline_dir }}/ntirpc-{{ ganesha_ntirpc_version }}.tar.gz"
    dest: "{{ ganesha_source_dir }}/nfs-ganesha-{{ ganesha_version }}/src/libntirpc"
    remote_src: true
  when: not bundled_ntirpc.stat.exists

- name: cmake and build Ganesha
  ansible.builtin.shell: |
    cd {{ ganesha_source_dir }}/nfs-ganesha-{{ ganesha_version }}/src
    cmake -DCMAKE_BUILD_TYPE=Release \
          -DUSE_FSAL_VFS=ON -DUSE_FSAL_NFSV3=ON \
          -DUSE_DBUS=ON -DUSE_RPC_RDMA=OFF \
          -DBUILD_CONFIG=release \
          -DCMAKE_INSTALL_PREFIX=/usr/local .
    make -j$(nproc)
    make install
  args:
    creates: /usr/local/bin/ganesha.nfsd

- name: ldconfig
  ansible.builtin.command: ldconfig
  changed_when: false

- name: render ganesha.conf
  ansible.builtin.template:
    src: ganesha.conf.j2
    dest: /etc/ganesha/ganesha.conf
    mode: '0644'
  notify: restart ganesha

- name: render ganesha systemd unit
  ansible.builtin.template:
    src: nfs-ganesha.service.j2
    dest: /etc/systemd/system/nfs-ganesha.service
    mode: '0644'
  notify:
    - daemon reload
    - restart ganesha

- name: ensure ganesha disabled (keepalived notify 拉起)
  ansible.builtin.systemd:
    name: nfs-ganesha
    enabled: false
    state: stopped
  # ⚠ systemd start 由 keepalived notify-master 触发

- name: create export directory
  ansible.builtin.file:
    path: "{{ ganesha_export_path }}"
    state: directory
    mode: '0755'
