---
# Casdoor ×2（apps 组）：共享 PG（casdoor_db），无本地状态 → 两实例可并行
- name: create casdoor dir
  ansible.builtin.file:
    path: "{{ casdoor_dir }}"
    state: directory
    mode: '0755'

- name: render app.conf (share DB connection)
  ansible.builtin.template:
    src: app.conf.j2
    dest: "{{ casdoor_dir }}/app.conf"
    mode: '0644'   # 容器内非 root uid 需可读（同 redis.conf 处理）

- name: render casdoor docker-compose.yml
  ansible.builtin.template:
    src: docker-compose-casdoor.yml.j2
    dest: "{{ casdoor_dir }}/docker-compose.yml"
    mode: '0644'

- name: docker compose up casdoor
  ansible.builtin.command: docker compose -f {{ casdoor_dir }}/docker-compose.yml up -d
  changed_when: true

- name: wait casdoor port
  ansible.builtin.wait_for:
    port: "{{ casdoor_port }}"
    timeout: 60

- name: casdoor health check
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ casdoor_port }}/api/healthz"
    status_code: [200]
  register: casdoor_health
  retries: 10
  delay: 5
  until: casdoor_health.status == 200
