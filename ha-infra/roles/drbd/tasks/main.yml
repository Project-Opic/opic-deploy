---
# DRBD 角色任务（对应 runbook P2a + P2b）
# 序列：kernel-devel 检查 → 源码编译 → create-md → attach → primary → 同步 → XFS → 挂载
# ⚠ 首次全量同步 7.3T ≈ 2h @1.0GB/s——需要停写窗

- name: install kernel-devel (if not present)
  ansible.builtin.package:
    name: "kernel-devel-{{ ansible_kernel }}"
    state: present
  when: ansible_os_family in ['openEuler', 'Anolis']

- name: install DRBD build dependencies
  ansible.builtin.package:
    name:
              - gcc
              - make
              - flex
              - bison
              - pkgconf-pkg-config
              - kmod-devel
              - systemd-devel
              - libudev-devel
              - kernel-headers
              - autoconf
              - automake
              - libtool
              - libxslt    # drbd-utils doc 目标需 xsltproc
    state: present

- name: remove EPEL drbd userspace packages (source build 9.29.0 replaces them)
  ansible.builtin.package:
    name:
      - drbd
      - drbd-utils
      - drbd-udev
      - drbd-selinux
    state: absent
  when: drbd_remove_epel_pkgs | default(false) | bool

- name: verify kernel-devel matches running kernel
  ansible.builtin.shell: |
    rpm -q kernel-devel --qf '%{version}-%{release}.%{arch}' 2>/dev/null | grep -q '{{ ansible_kernel }}'
  register: kdev_match
  changed_when: false
  failed_when: kdev_match.rc != 0

- name: create build directory
  ansible.builtin.file:
    path: "{{ drbd_source_dir }}"
    state: directory
    mode: '0755'

- name: copy DRBD source tarball (offline media)
  ansible.builtin.copy:
    src: "{{ offline_dir }}/drbd-{{ drbd_version }}.tar.gz"
    dest: "{{ drbd_source_dir }}/"
    mode: '0644'
  when: offline_mode | bool

# ── DRBD kernel module ──
- name: extract DRBD source
  ansible.builtin.unarchive:
    src: "{{ drbd_source_dir }}/drbd-{{ drbd_version }}.tar.gz"
    dest: "{{ drbd_source_dir }}"
    remote_src: true
    creates: "{{ drbd_source_dir }}/drbd-{{ drbd_version }}/drbd"

- name: generate compat patch (spatch-as-a-service)
  ansible.builtin.get_url:
    url: "{{ drbd_spatch_service }}/compat?kernel={{ ansible_kernel }}&drbd={{ drbd_version }}"
    dest: "{{ drbd_source_dir }}/drbd-{{ drbd_version }}/compat.patch"
    mode: '0644'
  when: ansible_os_family == 'openEuler'
  # 仅首次需要；后续缓存于 cocci_cache/

- name: stat compat patch
  ansible.builtin.stat:
    path: "{{ drbd_source_dir }}/drbd-{{ drbd_version }}/compat.patch"
  register: compat_patch

- name: apply compat patch
  ansible.builtin.command: patch -p1 -i compat.patch
  args:
    chdir: "{{ drbd_source_dir }}/drbd-{{ drbd_version }}"
    creates: "{{ drbd_source_dir }}/drbd-{{ drbd_version }}/.compat_applied"
  when: compat_patch.stat.exists

- name: mark compat applied
  ansible.builtin.file:
    path: "{{ drbd_source_dir }}/drbd-{{ drbd_version }}/.compat_applied"
    state: touch
  when: compat_patch.stat.exists

# Alibaba Cloud Linux 3（5.10.134-19.202.al8）内核的 DAX 是厂商中间形态
# （fs_dax_get_by_bdev 3 参 holder+ops，既非上游 ≤5.15 也非 ≥6.0），
# DRBD 9.2.20 compat 探测无此形态 → drbd_dax_pmem.c 编译必炸；
# 且 Kbuild.drbd 的条件（symvers 含 arch_wb_cache_pmem → CONFIG=n 但不定义
# DAX_PMEM_IS_INCOMPLETE）导致 modpost undefined —— al8 上 9.2.20 固有缺陷。
# lab 无 persistent memory → 无条件强制关闭 DAX（.o 与头守卫同步关）。
- name: force-disable DRBD DAX (al8 vendor DAX backport not covered by 9.2.20 compat)
  ansible.builtin.replace:
    path: "{{ drbd_source_dir }}/drbd-{{ drbd_version }}/drbd/Kbuild.drbd"
    regexp: '^CONFIG_DRBD_DAX := y$'
    replace: 'CONFIG_DRBD_DAX := n'
  when: drbd_disable_dax | default(false) | bool

- name: define DAX_PMEM_IS_INCOMPLETE so header stubs take effect
  ansible.builtin.blockinfile:
    path: "{{ drbd_source_dir }}/drbd-{{ drbd_version }}/drbd/Kbuild.drbd"
    marker: "# {mark} OPIC al8 DAX workaround"
    insertafter: EOF
    block: |
      override EXTRA_CFLAGS += -DDAX_PMEM_IS_INCOMPLETE
  when: drbd_disable_dax | default(false) | bool

- name: compile DRBD kernel module
  ansible.builtin.make:
    chdir: "{{ drbd_source_dir }}/drbd-{{ drbd_version }}/drbd"
    target: all
  # 编译耗时 ~5min/台

- name: install DRBD kernel module
  ansible.builtin.make:
    chdir: "{{ drbd_source_dir }}/drbd-{{ drbd_version }}/drbd"
    target: install

- name: load drbd module
  community.general.modprobe:
    name: drbd
    state: present
  register: drbd_mod

# ── DRBD utils ──
- name: copy drbd-utils source tarball (offline media)
  ansible.builtin.copy:
    src: "{{ offline_dir }}/drbd-utils-{{ drbd_utils_version }}.tar.gz"
    dest: "{{ drbd_source_dir }}/"
    mode: '0644'
  when: offline_mode | bool

- name: extract drbd-utils source
  ansible.builtin.unarchive:
    src: "{{ drbd_source_dir }}/drbd-utils-{{ drbd_utils_version }}.tar.gz"
    dest: "{{ drbd_source_dir }}"
    remote_src: true
    creates: "{{ drbd_source_dir }}/drbd-utils-{{ drbd_utils_version }}/configure"

# drbd-utils 的 drbd-headers 也是 git submodule（archive 解出为空目录），
# 按 v9.29.0 gitlink sha=40911d1c 从 codeload 单独取
- name: copy drbd-headers submodule tarball (pinned 40911d1c)
  ansible.builtin.copy:
    src: "{{ offline_dir }}/drbd-headers-utils-40911d1c.tar.gz"
    dest: "{{ drbd_source_dir }}/"
    mode: '0644'
  when: offline_mode | bool

- name: extract drbd-headers into utils submodule dir
  ansible.builtin.unarchive:
    src: "{{ drbd_source_dir }}/drbd-headers-utils-40911d1c.tar.gz"
    dest: "{{ drbd_source_dir }}/drbd-utils-{{ drbd_utils_version }}/drbd-headers"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "{{ drbd_source_dir }}/drbd-utils-{{ drbd_utils_version }}/drbd-headers/linux/drbd.h"

# GitHub release tarball 不含 autotools 生成物（configure），只有 configure.ac
- name: generate configure script (autogen.sh)
  ansible.builtin.command: ./autogen.sh
  args:
    chdir: "{{ drbd_source_dir }}/drbd-utils-{{ drbd_utils_version }}"
    creates: configure

# release tarball 无 .git → drbd_buildtag.sh 走 "Unpack again" 分支；
# 预置带 GITHASH 的 header 让其走 reuse 分支（§同 drbd 内核侧 .drbd_git_revision）
- name: seed drbd_buildtag.h (tarball has no .git)
  ansible.builtin.copy:
    dest: "{{ drbd_source_dir }}/drbd-utils-{{ drbd_utils_version }}/user/shared/drbd_buildtag.h"
    content: |
      /* automatically generated. DO NOT EDIT. */
      #define GITHASH "opic-aliyun-lab"
      #define GITDIFF ""
    mode: '0644'
  args:
    force: false

- name: configure drbd-utils (without-manual — doc target needs online docbook DTD/XSL)
  ansible.builtin.command: |
    ./configure --prefix=/usr --localstatedir=/var --sysconfdir=/etc --without-manual
  args:
    chdir: "{{ drbd_source_dir }}/drbd-utils-{{ drbd_utils_version }}"
    creates: config.status

- name: compile drbd-utils
  ansible.builtin.make:
    chdir: "{{ drbd_source_dir }}/drbd-utils-{{ drbd_utils_version }}"

- name: install drbd-utils
  ansible.builtin.make:
    chdir: "{{ drbd_source_dir }}/drbd-utils-{{ drbd_utils_version }}"
    target: install

- name: verify drbdadm version
  ansible.builtin.command: drbdadm --version
  register: drbdadm_ver
  changed_when: false
  failed_when: drbdadm_version not in drbdadm_ver.stdout

# ── 资源配置 ──
- name: render nfsdata.res
  ansible.builtin.template:
    src: nfsdata.res.j2
    dest: /etc/drbd.d/nfsdata.res
    mode: '0600'
    owner: root
    group: root
  notify: restart drbd

- name: check if resource already attached
  ansible.builtin.command: drbdsetup status {{ drbd_resource }}
  register: already_attached
  changed_when: false
  failed_when: false

- name: create-md (整分区覆盖 — 需备份 S2D 残留头部)
  ansible.builtin.command: |
    drbdadm create-md {{ drbd_resource }} --force
  register: create_md
  changed_when: create_md.rc == 0
  when: already_attached.rc != 0
  # ⚠ 仅首次执行！资源已 attach（minor 占用）时跳过

- name: attach resource (drbdadm up)
  ansible.builtin.command: drbdadm up {{ drbd_resource }}
  register: drbd_up
  changed_when: drbd_up.rc == 0
  failed_when: false  # 二次执行 "minor exists" 非零退出属正常（§二-23）

- name: wait for peer connection
  ansible.builtin.command: drbdsetup status {{ drbd_resource }} -v
  register: drbd_status
  changed_when: false
  retries: 30
  delay: 2
  until: "'connection:Connected' in drbd_status.stdout"
  when: ansible_play_hosts | length > 1

# ── Primary 提升与格式化（仅在第一台执行）──
- name: promote to primary
  ansible.builtin.command: drbdadm primary {{ drbd_resource }} --force
  register: promote_res
  changed_when: promote_res.rc == 0
  failed_when: promote_res.rc != 0 and 'Already primary' not in (promote_res.stderr | default('')) and 'already Primary' not in (promote_res.stderr | default(''))
  when: drbd_seq | default(0) | int == 1
  run_once: true
  delegate_to: "{{ groups['nfs_vip'][0] }}"

- name: wait for initial sync
  ansible.builtin.command: drbdsetup status {{ drbd_resource }}
  register: sync_status
  changed_when: false
  until: "'disk:UpToDate' in sync_status.stdout and 'peer-disk:UpToDate' in sync_status.stdout"
  retries: 7200  # 7.3T ≈ 2h，每 5s 检查（lab 500G@400M ≈ 25min）
  delay: 5
  run_once: true
  delegate_to: "{{ groups['nfs_vip'][0] }}"

- name: format XFS
  community.general.filesystem:
    fstype: xfs
    dev: "{{ drbd_device }}"
    opts: "-K -f -L OPIC_NFS"
  when: drbd_seq | default(0) | int == 1
  run_once: true
  delegate_to: "{{ groups['nfs_vip'][0] }}"

- name: create mount point
  ansible.builtin.file:
    path: "{{ drbd_mount_point }}"
    state: directory
    mode: '0755'

- name: mount DRBD XFS
  ansible.builtin.mount:
    path: "{{ drbd_mount_point }}"
    src: "{{ drbd_device }}"
    fstype: xfs
    opts: noatime
    state: mounted
  when: drbd_seq | default(0) | int == 1
