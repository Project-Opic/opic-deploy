---
- name: render redis docker-compose.yml (Sentinel ×3)
  ansible.builtin.template:
    src: docker-compose-redis.yml.j2
    dest: "{{ opic_ha_stack }}/redis/docker-compose.yml"
    mode: '0644'
  notify: docker compose up redis

- name: render redis.conf
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ opic_ha_stack }}/redis/redis.conf"
    mode: '0640'
  notify: docker compose up redis

- name: render sentinel.conf
  ansible.builtin.template:
    src: sentinel.conf.j2
    dest: "{{ opic_ha_stack }}/redis/sentinel.conf"
    mode: '0640'
  notify: docker compose up redis

- name: docker compose up
  ansible.builtin.command: docker compose -f {{ opic_ha_stack }}/redis/docker-compose.yml up -d
  changed_when: true
